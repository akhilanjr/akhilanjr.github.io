# Site settings
title: Akhilan J R
email: akhilanjr@gmail.com
description: "Senior Research Associate at J-PAL"
github_username: akhilanjr
minimal_mistakes_skin: default
search: false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
timezone: Asia/Kolkata

include:
  - _pages

# Not part of the website
exclude:
  - cv/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Akhilan J R"
  avatar : "/assets/images/ak_profile.jpeg"
  bio    : "Senior Research Associate at J-PAL"
  email  : "akhilanjr@gmail.com"   # shown under the J-PAL link
  links:
    - label: "J-PAL profile"
      icon: "fas fa-fw fa-link"
      url: "https://www.povertyactionlab.org/person/j-r"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/akhilanjr"
    - label: "J-PAL profile"
      icon: "fas fa-fw fa-link"
      url: "https://www.povertyactionlab.org/person/j-r"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
